id = "aksh1618.annotate-thread"
name = "Annotate Thread"
version = "0.2.0"
description = "Quote-reply annotate the focused pane's thread in nvim, in the pane's own slot"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Annotate thread"
description = "Open the focused pane's scrollback in nvim for quote-reply annotation"
contexts = ["pane", "selection"]
command = ["./open.sh"]

[[panes]]
id = "annotate"
title = "annotate"
placement = "tab"
command = ["./herdr-annotate-thread.sh"]
